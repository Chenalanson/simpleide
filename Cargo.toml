[package]
name = "simple-embedded"
version = "0.1.0"
edition = "2021"
description = "Simple embedded - a folder-first embedded IDE built with egui"

[dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.34.3"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
raw-window-handle = "0.6"
regex = "1"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
similar = "2"
ureq = { version = "2.12", features = ["json"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winres = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
