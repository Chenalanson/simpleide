[package]
name = "mini-embedded-ide"
version = "0.1.0"
edition = "2021"
description = "A minimal, folder-first embedded IDE built with egui"

[dependencies]
eframe = { version = "0.34.3", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.34.3"
encoding_rs = "0.8"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dev]
opt-level = 1
